# Para o Coolify (ou docker compose local). Defina as variáveis no painel do Coolify.
services:
  viceclips:
    build: .
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      VICECLIPS_PASSWORD: ${VICECLIPS_PASSWORD:?defina a senha do site}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VICECLIPS_TITLE_LANG: ${VICECLIPS_TITLE_LANG:-pt-BR}
      VICECLIPS_CLIP_TTL_MINUTES: ${VICECLIPS_CLIP_TTL_MINUTES:-20}
      VICECLIPS_BUFFER_MINUTES: ${VICECLIPS_BUFFER_MINUTES:-30}
      VICECLIPS_CAPTION_LANG: ${VICECLIPS_CAPTION_LANG:-pt}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
    volumes:
      - viceclips-data:/data

volumes:
  viceclips-data:
